    http2 on;
    server_name limitra.com.ng www.limitra.com.ng;

    ssl_certificate /etc/letsencrypt/live/limitra.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limitra.com.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

