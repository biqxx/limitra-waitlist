name: Publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate runtime image metadata
        id: runtime_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/limitra-waitlist
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.runtime_meta.outputs.tags }}
          labels: ${{ steps.runtime_meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Generate migration image metadata
        id: migration_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/limitra-waitlist
          flavor: |
            latest=false
            prefix=migration-
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migration
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.migration_meta.outputs.tags }}
          labels: ${{ steps.migration_meta.outputs.labels }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

      - name: Export deployment images
        shell: bash
        run: |
          runtime_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/limitra-waitlist:main"
          migration_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/limitra-waitlist:migration-main"
          docker pull --platform linux/amd64 "$runtime_image"
          docker pull --platform linux/amd64 "$migration_image"
          docker save "$runtime_image" "$migration_image" | gzip -1 > limitra-waitlist-images.tar.gz

      - name: Upload deployment images
        uses: actions/upload-artifact@v4
        with:
          name: limitra-waitlist-images
          path: limitra-waitlist-images.tar.gz
          retention-days: 1
          if-no-files-found: error
