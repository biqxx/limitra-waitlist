name: limitra-waitlist

services:
  migrate:
    image: ${LIMITRA_MIGRATION_IMAGE:-ghcr.io/biqxx/limitra-waitlist:migration-main}
    profiles:
      - tools
    env_file:
      - .env.production
    networks:
      - platform_data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: ${LIMITRA_IMAGE:-ghcr.io/biqxx/limitra-waitlist:main}
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    networks:
      platform_edge:
        aliases:
          - limitra-waitlist
      platform_data: {}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000'+(process.env.NEXT_PUBLIC_BASE_PATH||'')+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  platform_edge:
    external: true
    name: platform_edge
  platform_data:
    external: true
    name: platform_data
